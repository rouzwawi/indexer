[package]
name = "bitmap-indexer"
version = "0.1.0"
edition = "2021"
authors = ["Bitmap Indexer Team"]
description = "WAH (Word-Aligned Hybrid) compressed bitmap indexing system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/bitmap-indexer"
keywords = ["bitmap", "indexing", "compression", "wah", "database"]
categories = ["algorithms", "data-structures", "database-implementations"]

[lib]
name = "bitmap_indexer"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "bitmap-indexer"
path = "src/bin/main.rs"

[dependencies]
memmap2 = "0.9"           # Memory-mapped files (replaces boost::interprocess)
sha1 = "0.10"             # SHA1 hashing (replaces boost + custom)
byteorder = "1.5"         # Byte order handling
thiserror = "1.0"         # Error handling
anyhow = "1.0"            # Error context
serde = { version = "1.0", features = ["derive"] }  # Serialization
serde_json = "1.0"        # JSON serialization

[dev-dependencies]
criterion = "0.5"         # Benchmarking
tempfile = "3.8"          # Temporary files for testing
proptest = "1.4"          # Property-based testing

[[bench]]
name = "bitmap_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1